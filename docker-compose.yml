# =====================================================================
# Layla — dev stack. `docker compose up` brings up the full dev bench.
# Prod hardening (TLS, real secrets, MCP profile) layered via profiles.
# =====================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16   # Postgres 16 + pgvector for RAG
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - ./deploy/litellm/config.yaml:/app/config.yaml:ro
    expose:
      - "4000"
    restart: unless-stopped

  layla-core:
    build:
      context: ./core
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    # Импортированные/созданные проекты и файлы агента должны переживать
    # пересборку. projects_dir по умолчанию — ./data/projects, а WORKDIR=/app,
    # т.е. /app/data/projects. Без этого тома проекты терялись при rebuild,
    # а строки в БД оставались указывать на исчезнувшие каталоги.
    volumes:
      - projectsdata:/app/data/projects
    expose:
      - "8000"
    restart: unless-stopped

  layla-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE}
    depends_on:
      - layla-core
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - layla-frontend
      - layla-core
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Адрес сайта для Caddy. По умолчанию http://localhost — простой HTTP без
      # авто-TLS и без редиректа. Для HTTPS укажите голый домен (example.com).
      LAYLA_SITE_ADDRESS: ${LAYLA_SITE_ADDRESS:-http://localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  projectsdata:
  caddydata:
  caddyconfig:
