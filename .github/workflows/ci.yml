name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: layla
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: layla_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U layla -d layla_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Migrate PostgreSQL
        run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://layla:ci-only-password@localhost:5432/layla_test
          LAYLA_SECRET_KEY: ci-only-encryption-key

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
