name: Code contracts

on:
  push:
    paths:
      - 'core/**'
      - '.github/workflows/code.yml'
  pull_request:
    paths:
      - 'core/**'
      - '.github/workflows/code.yml'

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: layla
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: code_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U layla -d code_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Verify packaged Code skills
        run: |
          pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/code-skill-wheel" .
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          wheel = next((Path(os.environ['RUNNER_TEMP']) / 'code-skill-wheel').glob('layla_core-*.whl'))
          sys.path.insert(0, str(wheel))
          from app.services import code_bundled_skills
          assert code_bundled_skills.__file__.startswith(str(wheel))
          skills = {name: dict(resources) for name, resources in code_bundled_skills.documents()}
          assert set(skills) == {'simplify', 'skillify', 'remember'}
          assert all('SKILL.md' in resources for resources in skills.values())
          assert 'templates/SKILL.md' in skills['skillify']
          print('Bundled Code skills and template load from the wheel')
          PY
      - name: Migrate PostgreSQL and check ORM drift
        run: alembic upgrade head && alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://layla:ci-only-password@localhost:5432/code_test
          LAYLA_SECRET_KEY: ci-only-encryption-key
      - name: Verify Code and shared provider contracts
        run: pytest -q tests/test_code_*.py tests/test_project_agent.py tests/test_history.py tests/test_mcp.py tests/test_provider_resilience.py tests/test_provider_keys.py
