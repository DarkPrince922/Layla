[project]
name = "layla-sandbox"
version = "0.1.0"
description = "Песочница Layla: команды в рабочей копии проекта с зависимостями."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "websockets>=13"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
